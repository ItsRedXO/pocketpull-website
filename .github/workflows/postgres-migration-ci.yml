name: PostgreSQL Migration CI

on:
  push:
    branches: [postgres-migration]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint:types
      - run: npx tsc --noEmit --skipLibCheck --module ESNext --moduleResolution bundler --target ES2022 backend/index.ts backend/lib/*.ts backend/repositories/*.ts backend/routes/*.ts backend/routes/battles/*.ts backend/db/*.ts backend/db/import/*.ts
      - run: npm run build
