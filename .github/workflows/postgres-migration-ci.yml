name: PostgreSQL Migration CI

on:
  push:
    branches: [main, postgres-migration, railway-fullstack-cutover, fix/railway-login-assets, fix/upgrader-battle-pg-cutover, fix/admin-postgres-cutover]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocketpull
          POSTGRES_PASSWORD: pocketpull
          POSTGRES_DB: pocketpull_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocketpull -d pocketpull_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pocketpull:pocketpull@127.0.0.1:5432/pocketpull_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Validate migrated schema
        run: npm run db:validate
      - name: Verify cashout return safety
        run: npx tsx backend/db/testCashoutReturnSafety.ts
      - name: Test admin authorization and cashout policy
        run: npx tsx --test backend/adminAuthorization.test.ts backend/cashoutAdminPolicy.test.ts
      - name: Test admin PostgreSQL adapter contract
        run: npx tsx --test backend/adminPostgresAdapter.test.ts
      - name: Typecheck backend
        run: npx tsc --noEmit --ignoreConfig --skipLibCheck --module ESNext --moduleResolution bundler --target ES2022 backend/index.ts backend/server.ts backend/lib/*.ts backend/repositories/*.ts backend/routes/*.ts backend/routes/battles/*.ts backend/db/*.ts backend/db/import/*.ts
      - name: Test provably-fair server seed bootstrap
        run: npx tsx --test backend/provablyFairServerSeed.test.ts
      - name: Test upgrader and battle PostgreSQL cutover
        run: npx tsx --test backend/pgCutoverRegression.test.ts backend/battleExecutionSchemaRegression.test.ts backend/battleUtils.test.ts backend/walletIdempotency.test.ts backend/battleRecovery.test.ts
      - name: Test battle client state guards
        run: npx tsx --test src/pages/battles/room/useBattleExecution.test.ts
      - name: Test Railway frontend serving
        run: npx tsx --test backend/frontendServing.test.ts
      - name: Test frontend wallet refresh interval
        run: npx tsx --test src/hooks/useBalanceRefresh.test.ts
      - name: Build frontend for PostgreSQL backend
        env:
          VITE_BACKEND_URL: https://postgres-backend.invalid
        run: npm run build
      - name: Verify frontend build output
        run: test -f dist/index.html
      - name: Smoke test PostgreSQL health endpoint
        run: |
          PORT=8787 npm run start:backend > /tmp/pocketpull-backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill $BACKEND_PID || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/health | grep -q '\"database\":\"postgresql\"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pocketpull-backend.log
          exit 1
      - name: Build backend container
        run: docker build -f Dockerfile.backend -t pocketpull-backend:test .
