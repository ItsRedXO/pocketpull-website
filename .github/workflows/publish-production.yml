name: Publish to Production

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to publish
        required: true
        default: staging
        type: string
      confirm:
        description: Type PUBLISH to confirm the production deployment
        required: true
        default: PUBLISH
        type: string

permissions:
  contents: read

concurrency:
  group: pocketpull-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish PocketPull to Railway production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirm != 'PUBLISH' }}
        run: |
          echo "Production publish cancelled: confirmation must be exactly PUBLISH."
          exit 1

      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
        run: railway up --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --ci
